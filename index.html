function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
async function unlock(pw){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  return new TextDecoder().decode(pt);
}
function show(h){document.open();document.write(h);document.close()}
async function go(pw,quiet){
  try{var h=await unlock(pw);try{sessionStorage.setItem("lxq",pw)}catch(x){}show(h)}
  catch(x){if(!quiet)document.getElementById("e").textContent="That password didn't work. Check Lincoln's email."}
}
